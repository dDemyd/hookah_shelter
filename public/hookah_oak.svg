<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 460" width="220" height="362" class="relative" style="filter: drop-shadow(rgba(255, 69, 0, 0.22) 0px 18px 35px); transition: filter 600ms;">
  <defs>
    <linearGradient id="mn-stem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#050505"></stop>
      <stop offset="20%" stop-color="#1c1c1c"></stop>
      <stop offset="50%" stop-color="#252525"></stop>
      <stop offset="80%" stop-color="#0e0e0e"></stop>
      <stop offset="100%" stop-color="#050505"></stop>
    </linearGradient>
    <linearGradient id="mn-tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#383532"></stop>
      <stop offset="40%" stop-color="#2a2826"></stop>
      <stop offset="100%" stop-color="#161412"></stop>
    </linearGradient>
    <linearGradient id="mn-tray-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1816"></stop>
      <stop offset="100%" stop-color="#0a0908"></stop>
    </linearGradient>
    <linearGradient id="mn-collar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c1c"></stop>
      <stop offset="30%" stop-color="#0a0a0a"></stop>
      <stop offset="55%" stop-color="#252525"></stop>
      <stop offset="100%" stop-color="#050505"></stop>
    </linearGradient>

    <!-- ГРАДІЄНТ ДЛЯ ДЕРЕВ'ЯНОЇ ШАХТИ (ЯК НА ФОТО) -->
    <linearGradient id="mn-wood-shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3d1d0c"></stop>
      <stop offset="25%" stop-color="#6e3b1c"></stop>
      <stop offset="50%" stop-color="#91522b"></stop>
      <stop offset="75%" stop-color="#6e3b1c"></stop>
      <stop offset="100%" stop-color="#3d1d0c"></stop>
    </linearGradient>

    <linearGradient id="mn-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.14)"></stop>
      <stop offset="50%" stop-color="rgba(255,255,255,0.02)"></stop>
      <stop offset="100%" stop-color="rgba(255,230,200,0.06)"></stop>
    </linearGradient>
    <radialGradient id="mn-glass-back" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="rgba(45,35,25,0.25)"></stop>
      <stop offset="70%" stop-color="rgba(15,12,10,0.55)"></stop>
      <stop offset="100%" stop-color="#0a0908"></stop>
    </radialGradient>
    <linearGradient id="mn-downstem" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1510"></stop>
      <stop offset="50%" stop-color="#6e562f"></stop>
      <stop offset="100%" stop-color="#1a1510"></stop>
    </linearGradient>
    <linearGradient id="mn-clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0e08"></stop>
      <stop offset="100%" stop-color="#0a0604"></stop>
    </linearGradient>
    <radialGradient id="mn-coal" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fff2c8"></stop>
      <stop offset="25%" stop-color="#ffb070"></stop>
      <stop offset="65%" stop-color="#ff4500"></stop>
      <stop offset="100%" stop-color="#2a0a00" stop-opacity="0.9"></stop>
    </radialGradient>
    <linearGradient id="mn-wave-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1612" stop-opacity="0.95"></stop>
      <stop offset="30%" stop-color="#0c0a08"></stop>
      <stop offset="100%" stop-color="#000000"></stop>
    </linearGradient>
    <linearGradient id="mn-premium-hose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151515"></stop>
      <stop offset="50%" stop-color="#282828"></stop>
      <stop offset="100%" stop-color="#0d0d0d"></stop>
    </linearGradient>
    <clipPath id="mn-cavity">
      <path d="M 116 42 Q 116 40 118 40 L 162 40 Q 164 40 164 42 L 160 70 Q 160 72 158 72 L 122 72 Q 120 72 120 70 Z"></path>
    </clipPath>
    <clipPath id="mn-flask-drop-clip">
      <path d="M 124.6 322 L 155.4 322 C 156 335, 160 348, 172 360 C 194 382, 215 400, 215 422 C 215 448, 180 454, 140 454 C 100 454, 65 448, 65 422 C 65 400, 86 382, 108 360 C 120 348, 124 335, 124.6 322 Z"></path>
    </clipPath>

    <!-- ТЕКСТУРНИЙ ПАТЕРН ВОЛОКОН ДЛЯ ШАХТИ -->
    <pattern id="mn-wood-lines" x="0" y="0" width="12" height="40" patternUnits="userSpaceOnUse">
      <path d="M 2 0 Q 5 15 1 40 M 9 0 Q 7 25 11 40" fill="none" stroke="rgba(0,0,0,0.35)" stroke-width="0.6"></path>
      <!-- Темні прожилки-тріщини як на фото -->
      <path d="M 4 8 L 5 15 L 3 22 M 8 28 L 6 35" fill="none" stroke="#120602" stroke-width="0.8"></path>
      <path d="M 6 0 Q 3 10 7 30" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.4"></path>
    </pattern>

    <pattern id="mn-stone" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.4" fill="rgba(255,255,255,0.07)"></circle>
      <circle cx="4" cy="3" r="0.3" fill="rgba(0,0,0,0.4)"></circle>
    </pattern>
  </defs>

  <!-- Шланг на підлозі -->
  <g opacity="0.85">
    <path d="M 122 312 L 115 315 L 116 319 L 122 316 Z" fill="#0d0d0d" stroke="#000" stroke-width="0.3"></path>
    <path d="M 116 317 C 80 335, 35 380, 42 435 C 45 452, 70 455, 95 455 C 115 455, 125 448, 115 442" fill="none" stroke="url(#mn-premium-hose)" stroke-width="5" stroke-linecap="round"></path>
    <path d="M 115 442 L 155 435" stroke="url(#mn-stem)" stroke-width="3" stroke-linecap="round"></path>
    <path d="M 155 435 L 157 434.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity="0.4"></path>
  </g>

  <!-- Чаша та вугілля -->
  <g>
    <path d="M 108 28 Q 108 24 112 24 L 168 24 Q 172 24 172 28 L 170 32 L 162 74 Q 162 78 158 78 L 122 78 Q 118 78 118 74 L 110 32 Z" fill="url(#mn-clay)" stroke="rgba(0,0,0,0.7)" stroke-width="0.8"></path>
    <rect x="109" y="28" width="62" height="1.5" fill="rgba(255,255,255,0.06)"></rect>
    <g clip-path="url(#mn-cavity)">
      <rect x="116" y="40" width="48" height="32" fill="#0a0606"></rect>
      <circle cx="140" cy="66" r="2" fill="#0a0606" stroke="rgba(255,140,80,0.18)" stroke-width="0.5"></circle>
    </g>
    <path d="M 116 42 Q 116 40 118 40 L 162 40 Q 164 40 164 42" stroke="rgba(0,0,0,0.6)" stroke-width="1.5" fill="none"></path>
    <g>
      <ellipse cx="140" cy="24" rx="33" ry="3.5" fill="#3a3a3a"></ellipse>
      <ellipse cx="140" cy="22" rx="33" ry="3.5" fill="#7a7a7a"></ellipse>
      <ellipse cx="140" cy="21" rx="31" ry="3" fill="#a0a0a0"></ellipse>
      <path d="M 112 22 L 118 20 L 124 22 L 130 20 L 136 22 L 142 20 L 148 22 L 154 20 L 160 22 L 166 20" stroke="rgba(0,0,0,0.25)" stroke-width="0.4" fill="none"></path>
      <g style="animation: ember-flicker 2.6s ease-in-out infinite; transform-origin: 140px 14px;">
        <rect x="118" y="10" width="12" height="12" rx="1.2" fill="url(#mn-coal)" transform="rotate(-6 124 16)"></rect>
        <rect x="133" y="7" width="14" height="14" rx="1.4" fill="url(#mn-coal)" transform="rotate(4 140 14)"></rect>
        <rect x="150" y="10" width="12" height="12" rx="1.2" fill="url(#mn-coal)" transform="rotate(8 156 16)"></rect>
        <path d="M 122 14 L 126 18 M 138 12 L 142 16 M 154 14 L 158 18" stroke="rgba(255,240,200,0.55)" stroke-width="0.4" fill="none"></path>
      </g>
    </g>
  </g>

  <!-- ОНОВЛЕНА ШАХТА: ТЕПЕР ВОНА З ДЕРЕВА ЯК НА ФОТО -->
  <g>
    <rect x="134" y="78" width="12" height="218" fill="url(#mn-wood-shaft)"></rect>
    <rect x="134" y="78" width="12" height="218" fill="url(#mn-wood-lines)"></rect>
    <!-- Металеві носики-обойми на кінцях дерев'яної трубки -->
    <rect x="133.5" y="78" width="13" height="3" fill="#1a1a1a" stroke="#000" stroke-width="0.3"></rect>
    <rect x="133.5" y="293" width="13" height="3" fill="#1a1a1a" stroke="#000" stroke-width="0.3"></rect>
    <!-- Тонкий об'ємний блік вздовж всієї шахти -->
    <rect x="139.2" y="81" width="0.8" height="212" fill="rgba(255,255,255,0.08)"></rect>
  </g>

  <!-- Тонше блюдце -->
  <g>
    <ellipse cx="140" cy="85" rx="94" ry="1.8" fill="url(#mn-tray-edge)"></ellipse>
    <path d="M 48 81 Q 48 79.5 53 79.5 L 227 79.5 Q 232 79.5 232 81 L 232 81.8 Q 232 83.5 227 83.5 L 53 83.5 Q 48 83.5 48 81.8 Z" fill="url(#mn-tray)" stroke="rgba(0,0,0,0.6)" stroke-width="0.4"></path>
    <path d="M 48 81 Q 48 79.5 53 79.5 L 227 79.5 Q 232 79.5 232 81 L 232 81.8 Q 232 83.5 227 83.5 L 53 83.5 Q 48 83.5 48 81.8 Z" fill="url(#mn-stone)" opacity="0.65"></path>
    <path d="M 53 79.9 L 227 79.9" stroke="rgba(255,255,255,0.07)" stroke-width="0.4"></path>
    <ellipse cx="140" cy="80.5" rx="5" ry="0.6" fill="#050403"></ellipse>
  </g>

  <!-- БАЗА (КОЛАР) ПОВЕРНУТА ДО СТИЛЬНОГО МЕТАЛУ З НАПИСОМ C X -->
  <g>
    <rect x="122" y="296" width="36" height="22" rx="2.5" fill="url(#mn-collar)" stroke="rgba(0,0,0,0.8)" stroke-width="0.6"></rect>
    <line x1="122" y1="302" x2="158" y2="302" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"></line>
    <line x1="122" y1="302.6" x2="158" y2="302.6" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"></line>
    <line x1="122" y1="313" x2="158" y2="313" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"></line>
    <line x1="122" y1="313.6" x2="158" y2="313.6" stroke="rgba(0,0,0,0.5)" stroke-width="0.5"></line>
    <text x="140" y="310.5" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-family="Manrope, sans-serif" font-size="6.8" font-weight="900" letter-spacing="0.5">C X</text>
    <path d="M 126 318 L 154 318 L 152 324 L 128 324 Z" fill="#0a0a0a"></path>
    <line x1="131" y1="296" x2="149" y2="296" stroke="rgba(0,0,0,0.7)" stroke-width="0.5"></line>
  </g>

  <!-- КОЛБА З ЖИВОЮ ХВИЛЕЮ ТА БУЛЬБАШКАМИ -->
  <g>
    <path d="M 124.6 322 L 155.4 322 C 156 335, 160 348, 172 360 C 194 382, 215 400, 215 422 C 215 448, 180 454, 140 454 C 100 454, 65 448, 65 422 C 65 400, 86 382, 108 360 C 120 348, 124 335, 124.6 322 Z" fill="url(#mn-glass-back)"></path>

    <rect x="138.5" y="322" width="3" height="112" fill="url(#mn-downstem)"></rect>
    <circle cx="140" cy="434" r="1.8" fill="#3a2f1c"></circle>

    <g clip-path="url(#mn-flask-drop-clip)">
      <path fill="url(#mn-wave-water)">
        <animate attributeName="d" 
          values="M 64 422 C 80 420, 110 425, 140 422 C 170 419, 200 424, 216 422 L 216 455 L 64 455 Z;
                  M 64 422 C 80 424, 110 419, 140 422 C 170 425, 200 420, 216 422 L 216 455 L 64 455 Z;
                  M 64 422 C 80 420, 110 425, 140 422 C 170 419, 200 424, 216 422 L 216 455 L 64 455 Z" 
          dur="5s" repeatCount="indefinite" />
      </path>

      <!-- Набір бульбашок -->
      <circle cx="122" cy="450" r="2.2" fill="rgba(255,255,255,0.35)" stroke="rgba(255,240,220,0.15)" stroke-width="0.3">
        <animate attributeName="cy" values="450;423" dur="2.2s" repeatCount="indefinite" begin="0s" />
        <animate attributeName="opacity" values="0;0.85;0.85;0" dur="2.2s" repeatCount="indefinite" begin="0s" />
        <animate attributeName="cx" values="122;125;120;123" dur="2.2s" repeatCount="indefinite" begin="0s" />
      </circle>

      <circle cx="154" cy="452" r="1.6" fill="rgba(255,255,255,0.3)">
        <animate attributeName="cy" values="452;424" dur="1.7s" repeatCount="indefinite" begin="0.4s" />
        <animate attributeName="opacity" values="0;0.9;0.6;0" dur="1.7s" repeatCount="indefinite" begin="0.4s" />
        <animate attributeName="cx" values="154;151;156;153" dur="1.7s" repeatCount="indefinite" begin="0.4s" />
      </circle>

      <circle cx="135" cy="446" r="1.4" fill="rgba(255,255,255,0.4)">
        <animate attributeName="cy" values="446;422" dur="1.4s" repeatCount="indefinite" begin="0.9s" />
        <animate attributeName="opacity" values="0;0.9;0.9;0" dur="1.4s" repeatCount="indefinite" begin="0.9s" />
        <animate attributeName="cx" values="135;137;133;136" dur="1.4s" repeatCount="indefinite" begin="0.9s" />
      </circle>

      <circle cx="146" cy="451" r="2" fill="rgba(255,255,255,0.3)">
        <animate attributeName="cy" values="451;423" dur="2.5s" repeatCount="indefinite" begin="0.2s" />
        <animate attributeName="opacity" values="0;0.8;0.5;0" dur="2.5s" repeatCount="indefinite" begin="0.2s" />
      </circle>

      <circle cx="114" cy="448" r="1.8" fill="rgba(255,255,255,0.32)">
        <animate attributeName="cy" values="448;424" dur="1.9s" repeatCount="indefinite" begin="0.7s" />
        <animate attributeName="opacity" values="0;0.85;0.7;0" dur="1.9s" repeatCount="indefinite" begin="0.7s" />
        <animate attributeName="cx" values="114;117;113;115" dur="1.9s" repeatCount="indefinite" begin="0.7s" />
      </circle>

      <circle cx="162" cy="449" r="2.1" fill="rgba(255,255,255,0.25)" stroke="rgba(255,240,220,0.1)" stroke-width="0.3">
        <animate attributeName="cy" values="449;423" dur="2.3s" repeatCount="indefinite" begin="1.2s" />
        <animate attributeName="opacity" values="0;0.8;0.6;0" dur="2.3s" repeatCount="indefinite" begin="1.2s" />
      </circle>

      <circle cx="129" cy="453" r="1.1" fill="rgba(255,255,255,0.45)">
        <animate attributeName="cy" values="453;422" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
        <animate attributeName="opacity" values="0;0.95;0.9;0" dur="1.3s" repeatCount="indefinite" begin="0.5s" />
      </circle>

      <circle cx="141" cy="454" r="2.4" fill="rgba(255,255,255,0.28)" stroke="rgba(255,240,220,0.15)" stroke-width="0.4">
        <animate attributeName="cy" values="454;422" dur="2.6s" repeatCount="indefinite" begin="1.5s" />
        <animate attributeName="opacity" values="0;0.75;0.75;0" dur="2.6s" repeatCount="indefinite" begin="1.5s" />
        <animate attributeName="cx" values="141;139;143;140" dur="2.6s" repeatCount="indefinite" begin="1.5s" />
      </circle>
    </g>

    <!-- Переднє скло колби -->
    <path d="M 124.6 322 L 155.4 322 C 156 335, 160 348, 172 360 C 194 382, 215 400, 215 422 C 215 448, 180 454, 140 454 C 100 454, 65 448, 65 422 C 65 400, 86 382, 108 360 C 120 348, 124 335, 124.6 322 Z" fill="url(#mn-glass)" stroke="rgba(255,255,255,0.13)" stroke-width="0.8"></path>

    <!-- Відблиски -->
    <path d="M 72 415 C 75 398, 92 380, 108 364" stroke="rgba(255,255,255,0.11)" stroke-width="1.8" fill="none" stroke-linecap="round"></path>
    <path d="M 208 415 C 205 398, 188 380, 172 364" stroke="rgba(255,255,255,0.05)" stroke-width="1.2" fill="none" stroke-linecap="round"></path>

    <ellipse cx="140" cy="454" rx="55" ry="4.5" fill="rgba(255,110,50,0.06)"></ellipse>
    <rect x="124.6" y="320" width="30.8" height="3" fill="rgba(0,0,0,0.6)"></rect>
  </g>
</svg>
