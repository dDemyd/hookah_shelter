# Сховище — Supabase CLI config.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "shelter"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false  # only the admin invites staff via Supabase dashboard

[auth.email]
# Required for local staff email/password sign-in. Public staff creation is still
# controlled by the admin/service-role flow, not by an in-app signup screen.
enable_signup = true
enable_confirmations = false

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[inbucket]
enabled = true
port = 54324
